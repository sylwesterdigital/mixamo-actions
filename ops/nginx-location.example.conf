# Include inside an EXISTING server { } block for the appropriate hostname.
# Does not create HTTPS or a new virtual host.
location /labs/mixamo-actions/ {
    alias /var/www/mojoworks/labs/mixamo-actions/;
    index index.html;
    try_files $uri $uri/ =404;
}
location = /labs/mixamo-actions {
    return 301 /labs/mixamo-actions/;
}
